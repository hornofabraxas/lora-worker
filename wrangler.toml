name = "lora-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

[triggers]
crons = ["0 */6 * * *"]

# Cloudflare Access guards the browser-facing admin page at /admin (and the
# /admin/api/* calls it makes) — see src/middleware/access.ts. Neither value here
# is a secret: AUD is the Access application's public audience tag, and the team
# domain is the public Zero Trust login host. The Worker verifies the Access JWT
# itself rather than trusting the edge to have blocked the request.
#
# ADMIN_EMAILS is deliberately NOT here. It is the operator allow-list checked in
# access.ts and, while it grants nothing without a matching Cloudflare Access
# account, this file is public — so it is set as a secret instead:
#
#   npx wrangler secret put ADMIN_EMAILS      # comma-separated, no spaces needed
#
# The Worker reads c.env.ADMIN_EMAILS identically whether it comes from a var or
# a secret, so nothing in the code changes. Leaving it unset is also valid: the
# Access application's own policy is then the only gate (see access.ts).
#
# The admin Usage tab (GET /admin/api/usage, src/logic/usage.ts) reads today's
# Worker + Durable Object request counts from the Cloudflare GraphQL Analytics
# API. It needs the account id and a read-only token scoped to
# "Account Analytics: Read" — set both as secrets (the token is read-only but is
# still a credential, so it does not belong in this public file):
#
#   npx wrangler secret put CF_ACCOUNT_ID       # the Cloudflare account id
#   npx wrangler secret put CF_ANALYTICS_TOKEN  # token: Account Analytics -> Read
#
# Leaving either unset makes the Usage tab show "not configured" instead of
# failing — nothing else depends on them.
[vars]
ACCESS_AUD = "a416f57695a708e11eed20e991aedda5c19dfd9b988bc18f4c43d2b97cd64893"
ACCESS_TEAM_DOMAIN = "thebeacons.cloudflareaccess.com"
# Floor for the game server's reported X-Client-Version (middleware/version.ts).
# "0.0.0" means no enforcement — every version compares >= it. Raise this only
# alongside a breaking wire/schema change, in the same commit as that change,
# so the floor and the reason for it are reviewed together.
MIN_CLIENT_VERSION = "0.0.0"

# Registration caps (routes/register.ts). All opt-in; these bound player
# *creation* so a leaked invite code — every player's client config holds one —
# can't mint players without limit. Raw request volume is bounded separately at
# the Cloudflare edge (WAF rate-limiting rule on /api/*), not here.
#   MAX_TOTAL_PLAYERS       — hard lifetime roster ceiling; registration closes
#                             (403) once the roster reaches it.
#   REGISTER_DAILY_LIMIT    — global new players per UTC day (429 over).
#   REGISTER_IP_DAILY_LIMIT — new players per CF-Connecting-IP per UTC day (429);
#                             skipped when the header is absent (local/dev).
MAX_TOTAL_PLAYERS = "500"
REGISTER_DAILY_LIMIT = "100"
REGISTER_IP_DAILY_LIMIT = "3"

# Storage runs on SQLite-backed Durable Objects (free tier: 100k writes/day vs
# KV's 1k). Consolidated 2026-07-22: every logical namespace now shares ONE
# KvStore instance (keys prefixed per namespace), so a poll/bundle/raid can read
# or write across them in a single RPC and raids resolve atomically. The adapter
# preserves the KV interface so routes/queries are unchanged. Class/migration are
# unchanged by the consolidation. See src/kv/do_store.ts and
# docs/do-consolidation-2026-07.md.
[[durable_objects.bindings]]
name = "KV_DO"
class_name = "KvStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KvStore"]

# KV namespaces were migrated to the KvStore Durable Object (2026-07-11) and
